<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>신쌤 | 치지직 스트리머</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(135deg, #111827, #1f2933);
      color: #f9fafb;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: #22c55e;
      color: #022c22;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #d1d5db;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 50px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .card h3 {
      margin-bottom: 10px;
      color: #fbbf24;
    }

    .links {
      margin-top: 60px;
    }

    .links a {
      display: inline-block;
      margin: 10px;
      padding: 14px 26px;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    .links a:hover {
      background: #1d4ed8;
    }

    footer {
      margin-top: 80px;
      font-size: 0.9rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>신쌤</h1>
    <div class="badge">치지직 스트리머</div>

    <p>
      토크와 스팀 게임을 중심으로<br />
      편안하고 솔직한 방송을 하는 스트리머
    </p>

    <div class="cards">
      <div class="card">
        <h3>🗣 토크</h3>
        <p>시청자와 자유롭게 소통하는 잡담 방송</p>
      </div>
      <div class="card">
        <h3>🎮 스팀 게임</h3>
        <p>공포, 인디, 스토리 게임 위주 플레이</p>
      </div>
      <div class="card">
        <h3>🦊 컨셉</h3>
        <p>여유 있고 위트 있는 신쌤 스타일</p>
      </div>
    </div>

    <div class="links">
      <a href="https://chzzk.naver.com" target="_blank">치지직 바로가기</a>
    </div>

    <footer>
      © 2026 신쌤 팬 페이지
    </footer>
  </div>
</body>
</html>


</body>
</html>
