<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>신쌤 | 치지직 스트리머 팬페이지</title>
<meta name="description" content="토크와 스팀 게임 중심의 치지직 스트리머 신쌤 공식 팬페이지">

<!-- Open Graph -->
<meta property="og:title" content="신쌤 | 치지직 스트리머">
<meta property="og:description" content="편안하고 솔직한 토크, 스팀 게임 방송">
<meta property="og:image" content="profile.png">
<meta property="og:type" content="website">

<style>
body{
  margin:0;
  font-family:"Pretendard","Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(135deg,#111827,#1f2933);
  color:#f9fafb;
  line-height:1.7;
}
.container{
  max-width:900px;
  margin:auto;
  padding:60px 20px;
  text-align:center;
}
h1{font-size:3rem;margin-bottom:10px}
.profile-img{
  width:160px;height:160px;border-radius:50%;
  object-fit:cover;margin-bottom:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.5)
}
.badge{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  background:#22c55e;
  color:#022c22;
  font-weight:bold;
}
p{color:#d1d5db;font-size:1.1rem}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-top:50px;
}
.card{
  background:rgba(255,255,255,.05);
  border-radius:20px;
  padding:30px;
}

#onAir{
  display:inline-block;
  margin-top:30px;
  padding:12px 24px;
  border-radius:12px;
  font-weight:bold;
  background:#111;
}

section{margin-top:50px}

iframe{
  width:100%;
  height:315px;
  border-radius:16px;
  border:none;
}

canvas{max-width:600px;margin:auto}

input,textarea,button{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
}
button{
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

.entry{
  border-bottom:1px solid #374151;
  padding:6px 0;
  text-align:left;
}

.links{
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:40px;
}
.links a{
  padding:12px 20px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
}
.youtube{background:#ef4444;color:#fff}
.discord{background:#5865F2;color:#fff}
.cafe{background:#03c75a;color:#fff}
.chzzk{background:#22c55e;color:#000}

footer{
  margin-top:80px;
  font-size:.9rem;
  color:#9ca3af;
}

@media(max-width:480px){
  h1{font-size:2.2rem}
  .profile-img{width:120px;height:120px}
}
</style>
</head>

<body>
<div class="container">

<h1>신쌤</h1>
<img src="profile.png" alt="신쌤 캐릭터" class="profile-img">
<div class="badge">치지직 스트리머</div>
<p>토크와 스팀 게임을 중심으로<br>편안하고 솔직한 방송</p>

<!-- ON AIR -->
<div id="onAir">🔴 OFF AIR</div>
<p style="font-size:13px;color:#9ca3af">실제 방송 여부는 치지직을 기준으로 합니다</p>

<!-- 콘텐츠 카드 -->
<div class="cards">
  <div class="card"><h3>🗣 토크</h3><p>자유로운 소통 중심</p></div>
  <div class="card"><h3>🎮 스팀 게임</h3><p>공포·인디·스토리</p></div>
  <div class="card"><h3>🦊 컨셉</h3><p>여유롭고 위트 있는 진행</p></div>
</div>

<!-- YouTube -->
<section>
<h2>📺 유튜브 하이라이트</h2>
<iframe id="yt" loading="lazy"></iframe>
</section>

<!-- Stats -->
<section>
<h2>📊 신쌤 스탯</h2>
<canvas id="statChart"></canvas>
</section>

<!-- Guestbook -->
<section style="max-width:600px;margin:auto">
<h2>✍️ 방명록</h2>
<form id="guestbook">
  <input id="name" placeholder="이름" required>
  <textarea id="message" rows="3" placeholder="메시지" required></textarea>
  <button>남기기</button>
</form>
<div id="guestbookList"></div>
</section>

<!-- Links -->
<div class="links">
  <a class="youtube" href="https://www.youtube.com/channel/UCv1eMhf8h1JRV56g-Bax-Kw" target="_blank">유튜브</a>
  <a class="discord" href="https://discord.com/invite/kDxusHpDNw" target="_blank">디스코드</a>
  <a class="cafe" href="https://cafe.naver.com/shinseam98" target="_blank">팬카페</a>
  <a class="chzzk" href="https://chzzk.naver.com/d1a0e5ce3c051bb1ae633801d410f0a4" target="_blank">치지직</a>
</div>

<footer>© 2026 신쌤 팬 페이지</footer>
</div>

<!-- Chart.js (고정 버전) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>

<script>
/* =========================
   ON AIR (현실적 기준)
   ========================= */
function checkLive(){
  const now=new Date();
  const d=now.getDay(), h=now.getHours();
  const live=(d>=1&&d<=5&&h>=19&&h<22);
  const el=document.getElementById("onAir");
  el.textContent=live?"🔴 ON AIR":"🔴 OFF AIR";
  el.style.background=live?"#ef4444":"#111";
}
checkLive();
setInterval(checkLive,60000);

/* =========================
   YouTube (안정 fallback)
   ========================= */
const fallback="dQw4w9WgXcQ"; // 고정 영상
document.getElementById("yt").src=
  "https://www.youtube.com/embed/"+fallback;

/* =========================
   Chart
   ========================= */
document.addEventListener("DOMContentLoaded",()=>{
  new Chart(document.getElementById("statChart"),{
    type:"bar",
    data:{
      labels:["지능","진행력","기획력","썸네일","편집"],
      datasets:[{data:[89,85,75,65,50]}]
    },
    options:{
      indexAxis:"y",
      scales:{x:{min:0,max:100}},
      plugins:{legend:{display:false}}
    }
  });
});

/* =========================
   Guestbook (XSS 차단 + 저장)
   ========================= */
const list=document.getElementById("guestbookList");
let data=JSON.parse(localStorage.getItem("guestbook")||"[]");

function render(){
  list.innerHTML="";
  data.forEach(e=>{
    const d=document.createElement("div");
    d.className="entry";
    d.textContent=`${e.name}: ${e.message}`;
    list.append(d);
  });
}
render();

document.getElementById("guestbook").onsubmit=e=>{
  e.preventDefault();
  const name=document.getElementById("name").value.trim();
  const msg=document.getElementById("message").value.trim();
  if(!name||!msg)return;
  data.unshift({name,message:msg});
  data=data.slice(0,50);
  localStorage.setItem("guestbook",JSON.stringify(data));
  e.target.reset();
  render();
};
</script>

</body>
</html>
